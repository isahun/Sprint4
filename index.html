<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="">
    <meta name="author" content="Irene Sahun">
    <link href="/src/styles/style.css" rel="stylesheet">
    <title>sprint4-vite-migration</title>
</head>
<body class="bg-black min-h-screen flex flex-col items-center">
    <!-- Header / navbar -->
    <header class="flex flex-col w-full max-w-3xl px-6 pt-8 pb-4 text-center mb-6">
        <h1>Jokes & Weather</h1>
    </header>

    <main class="w-full max-w-3xl p-6 flex-1 flex flex-col items-center justify-center px-6">

      <!-- weather inputs + btn -->
      <aside id="weatherWidget" class="weather-collapsed fixed top-32 right-6 z-50 w-44 max-h-max flex flex-col border-2 border-zinc-700 rounded-3xl bg-black/70 backdrop-blur-xl text-center mb-6 gap-3 p-4 text-xs" aria-labelledby="weather">
        
        <h2 id="weatherTitle">Weather widget</h2>
          <form aria-describedby="weatherHelp">
            <p id="weatherHelp" class="sr-only">
              Enter latitude and longitude to get the weather
            </p>

            <div class="flex flex-col gap-2">
              <label for="latitude">Latitude</label>
              <input
                type="number"
                id="latitude"
                name="latitude"
                class="input-base"
                required
              />

              <label for="longitude">Longitude</label>
              <input
                type="number"
                id="longitude"
                name="longitude"
                class="input-base"
                required
              />
            </div>

            <button
              type="submit"
              id="weatherBtn"
              class="btn-primary mt-3"
            >
              Get weather
            </button>
        </form>        
        
        <!--weather result-->
        <div id="weatherSpace" class="text-xs text-yellow-400" aria-live="polite">
        </div>

        <div id="iconSpace" class="mx-auto mt-2 w-16 h-16">
          <img id="weatherIcon" class="w-full h-full object-contain" aria-hidden="true">
        </div>
      </aside>

      <!-- joke -->
      <section aria-labelledby="jokesTitle" class="flex flex-col justify-center items-center">
        <h2 id="jokesTitle" class="mb-3">Jokes</h2>
          <article class="border-2 border-yellow-400 max-w-100 rounded-3xl p-6 text-center bg-black/40 backdrop-blur-3xl">
            <blockquote class="mb-6 p-5 border border-gray-700 border-b-4 rounded-3xl">
              <p id="jokeSpace" aria-live="polite">Click the button below to start cracking up</p>
            </blockquote>

          <!-- joke score-->
            <fieldset id="scoreContainer" class="mb-4">
              <legend id="scoreQuestion" class="mb-2 text-xs">How did you feel about this joke?</legend>
                
              <select id="jokeScore" class="input-base w-auto  mb-6">
                <option value="">Rate the joke</option>
                <option value="1">😒 Lame</option>
                <option value="2">😐 Meh</option>
                <option value="3">😂 Loved it</option>
              </select>
                
              <div class="flex gap-2 justify-center">
                <button id="clearScore" class="btn-secondary">Clear score</button>
                <button id="showReport" class="btn-secondary">Show jokes report</button>
              </d>
            </fieldset>

          <!-- next joke button-->
          <button id="nextJokeBtn" class="btn-primary">Next joke</button>

          </article>
      </section>

      <section id="scoreSection" class="report-card text-center">
        <p id="scoreElement" class="report mt-4"></p>
      </section>
  </main>

  <footer class="mt-8 mb-3 footer-text">
    <p>IT Academy, 2026</p>
  </footer>


  <script type="module" src="/src/main.ts"></script>
</body>
</html>
